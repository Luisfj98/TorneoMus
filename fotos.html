<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2e0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fiestas Vegas 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background-color: #0f2e0f;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f0ead6;
      min-height: 100vh;
      padding: 32px 16px;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      position: relative;
      background: radial-gradient(circle at 50% 0%, #1a3d1a 0%, #0a1e0a 70%);
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2.4rem;
      color: #f4c430;
      letter-spacing: 3px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(244,196,48,0.3);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #a8c89a;
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.7rem; letter-spacing: 1px; }
    }

    .card {
      background: rgba(10, 35, 10, 0.75);
      border: 1px solid rgba(120, 180, 80, 0.35);
      border-radius: 14px;
      padding: 24px;
      margin: 0 auto 20px;
      max-width: 1200px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .toolbar h2 {
      color: #f4c430;
      font-size: 1.05rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .btn-refresh {
      all: unset;
      cursor: pointer;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(120,180,80,0.4);
      border-radius: 8px;
      color: #f4c430;
      font-size: 0.85rem;
      padding: 8px 16px;
      transition: background 0.15s;
    }
    .btn-refresh:hover { background: rgba(244,196,48,0.15); }

    /* ── Estados ── */
    .state-msg {
      text-align: center;
      padding: 40px 16px;
      color: #a8c89a;
      font-size: 0.95rem;
    }

    .state-msg.error {
      color: #f88;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid rgba(244,196,48,0.25);
      border-top-color: #f4c430;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Galería ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .photo-thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(120,180,80,0.3);
      background: rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .photo-thumb:hover {
      transform: translateY(-2px);
      border-color: #f4c430;
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-thumb .caption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 6px 8px;
      font-size: 0.7rem;
      color: #f0ead6;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 100%;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      all: unset;
      cursor: pointer;
      position: fixed;
      color: #f4c430;
      font-size: 1.8rem;
      padding: 10px 16px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
    }
    .lightbox-close { top: 20px; right: 20px; }
    .lightbox-prev { left: 12px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 12px; top: 50%; transform: translateY(-50%); }
    .lightbox-close:hover,
    .lightbox-prev:hover,
    .lightbox-next:hover { background: rgba(244,196,48,0.2); }

    .lightbox-caption {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      color: #ddd;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>&#127920; Fiestas Vegas 2026</h1>
    <p class="subtitle">Galería de fotos</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2>&#128247; Fotos</h2>
      <button class="btn-refresh" onclick="cargarFotos()">&#8635; Actualizar</button>
    </div>
    <div id="galleryContainer">
      <div class="state-msg" id="stateMsg">
        <div class="spinner"></div>
        Cargando fotos...
      </div>
      <div class="gallery" id="gallery" style="display:none"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="cerrarLightbox()">&times;</button>
    <button class="lightbox-prev" onclick="moverLightbox(-1)">&#8592;</button>
    <img id="lightboxImg" alt="" />
    <button class="lightbox-next" onclick="moverLightbox(1)">&#8594;</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

<script>
  // ── Configuración ──────────────────────────────────────────────────────
  // 1. Crea una API key en https://console.cloud.google.com/apis/credentials
  //    (habilita "Google Drive API" en el proyecto) y restríngela a ese dominio.
  // 2. Comparte la carpeta de Drive como "Cualquier usuario con el enlace: Lector"
  //    y copia su ID (el trozo de la URL tras /folders/).
  const CONFIG = {
    API_KEY: 'TU_API_KEY_AQUI',
    FOLDER_ID: 'TU_FOLDER_ID_AQUI',
  };

  let fotos = [];
  let lightboxIndex = 0;

  function urlMiniatura(id, tam) {
    return `https://drive.google.com/thumbnail?id=${id}&sz=w${tam}`;
  }

  async function cargarFotos() {
    const stateMsg = document.getElementById('stateMsg');
    const gallery  = document.getElementById('gallery');

    stateMsg.style.display = 'block';
    stateMsg.classList.remove('error');
    stateMsg.innerHTML = '<div class="spinner"></div>Cargando fotos...';
    gallery.style.display = 'none';

    if (CONFIG.API_KEY === 'TU_API_KEY_AQUI' || CONFIG.FOLDER_ID === 'TU_FOLDER_ID_AQUI') {
      stateMsg.classList.add('error');
      stateMsg.textContent = 'Falta configurar API_KEY y FOLDER_ID al principio del <script> de fotos.html.';
      return;
    }

    const query = `'${CONFIG.FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`;
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}` +
      `&fields=files(id,name)&orderBy=name&pageSize=1000&key=${CONFIG.API_KEY}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      fotos = data.files || [];

      if (fotos.length === 0) {
        stateMsg.style.display = 'block';
        stateMsg.textContent = 'No se encontraron fotos en la carpeta.';
        gallery.style.display = 'none';
        return;
      }

      renderGaleria();
      stateMsg.style.display = 'none';
      gallery.style.display = 'grid';
    } catch (err) {
      stateMsg.classList.add('error');
      stateMsg.textContent = 'No se pudieron cargar las fotos: ' + err.message;
    }
  }

  function renderGaleria() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    fotos.forEach((foto, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      thumb.onclick = () => abrirLightbox(i);

      const img = document.createElement('img');
      img.src = urlMiniatura(foto.id, 400);
      img.loading = 'lazy';
      img.alt = foto.name;
      thumb.appendChild(img);

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.textContent = foto.name;
      thumb.appendChild(caption);

      gallery.appendChild(thumb);
    });
  }

  function abrirLightbox(i) {
    lightboxIndex = i;
    mostrarLightbox();
    document.getElementById('lightbox').classList.add('open');
  }

  function mostrarLightbox() {
    const foto = fotos[lightboxIndex];
    document.getElementById('lightboxImg').src = urlMiniatura(foto.id, 1600);
    document.getElementById('lightboxCaption').textContent =
      `${foto.name} (${lightboxIndex + 1} / ${fotos.length})`;
  }

  function moverLightbox(dir) {
    lightboxIndex = (lightboxIndex + dir + fotos.length) % fotos.length;
    mostrarLightbox();
  }

  function cerrarLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') cerrarLightbox();
    if (e.key === 'ArrowLeft') moverLightbox(-1);
    if (e.key === 'ArrowRight') moverLightbox(1);
  });

  cargarFotos();
</script>
</body>
</html>
